version: '3.8'

services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      - DATABASE_URL=${SUPABASE_DB_URL}
      - JWT_SECRET=${JWT_SECRET}
      # Optimize OpenCV & ONNX for low memory environments
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M # Render Free Tier strict limit

  worker:
    build: .
    command: celery -A worker.app worker --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=${SUPABASE_DB_URL}
      - REDIS_URL=${REDIS_URL}