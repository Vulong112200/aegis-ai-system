version: '3.8'

services:
  # PostgreSQL Database (using Supabase or local)
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: aegis_db
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for Message Queue and Caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aegis_user:aegis_password@db:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  # AI Engine Worker
  ai_worker:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://aegis_user:aegis_password@db:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./ai_engine:/app

volumes:
  postgres_data: